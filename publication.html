<!DOCTYPE html>
<html lang="en">

<head>
  <title>Publications | Maheswar Pradhan</title>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

  <!-- Your publication CSS -->
  <link rel="stylesheet" href="css/publication.css">
</head>

<body>

<div class="container py-5">

  <!-- Header -->
  <div class="text-center mb-5">

    <h1>Publications</h1>

    <p class="lead">
      Peer-reviewed publications, reports and conference contributions
    </p>

    <a href="index.html" class="btn btn-outline-primary">
      ← Back to Home
    </a>

  </div>


  <!-- Search -->
  <div class="row mb-4">

    <div class="col-md-8 mx-auto">

      <input
        type="text"
        id="publicationSearch"
        class="form-control"
        placeholder="Search publications by title, author, journal or year..."
      >

    </div>

  </div>


  <!-- Category Filter -->
  <div class="text-center mb-5">

    <button class="btn btn-primary filter-btn active"
            data-filter="all">
      All
    </button>

    <button class="btn btn-outline-primary filter-btn"
            data-filter="journal">
      Journal Articles
    </button>

    <button class="btn btn-outline-primary filter-btn"
            data-filter="report">
      Reports / Thesis
    </button>

    <button class="btn btn-outline-primary filter-btn"
            data-filter="conference">
      Conferences / Talks
    </button>

  </div>


  <!-- Publications will be inserted here -->
  <div id="publications-container"></div>

</div>


<script src="js/publication.js"></script>

</body>
</html>
