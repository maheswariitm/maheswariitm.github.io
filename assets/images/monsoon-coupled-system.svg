<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Monsoon coupled system</title>
  <desc id="desc">An animated illustration of monsoon winds linking the Indian Ocean, the Indian subcontinent, and the atmosphere through heat and moisture exchange.</desc>
  <defs>
    <radialGradient id="ocean" cx="42%" cy="38%" r="68%"><stop offset="0" stop-color="#48aaa0" stop-opacity=".65"/><stop offset=".68" stop-color="#176f76" stop-opacity=".4"/><stop offset="1" stop-color="#102d37" stop-opacity=".12"/></radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5edda"/><stop offset="1" stop-color="#bbd8b9"/></linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2b67d" stop-opacity=".55"/><stop offset="1" stop-color="#d6eee0" stop-opacity=".05"/></linearGradient>
    <marker id="windArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9 2.5 4.5Z" fill="#f1b579"/></marker>
    <marker id="fluxArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#d8ead1"/></marker>
    <clipPath id="globeClip"><circle cx="300" cy="300" r="222"/></clipPath>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .wind-flow{animation:wind-dash 12s linear infinite}.flow-two{animation-duration:16s;animation-direction:reverse}
    .ocean-ripples path{animation:ripple 5s ease-in-out infinite}.ocean-ripples path:nth-child(2){animation-delay:-1.6s}.ocean-ripples path:nth-child(3){animation-delay:-3.2s}
    .flux-points circle{animation:flux-pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.flux-points circle:nth-child(2){animation-delay:-.8s}.flux-points circle:nth-child(3){animation-delay:-1.6s}
    @keyframes wind-dash{to{stroke-dashoffset:-136}}@keyframes ripple{50%{stroke-opacity:.24;transform:translateX(5px)}}@keyframes flux-pulse{50%{opacity:.45;transform:scale(.65)}}
    @media(prefers-reduced-motion:reduce){.wind-flow,.ocean-ripples path,.flux-points circle{animation:none}}
  </style>  <circle cx="300" cy="300" r="244" fill="none" stroke="#c9e4d2" stroke-opacity=".14"/>
  <ellipse cx="300" cy="300" rx="255" ry="116" transform="rotate(-28 300 300)" fill="none" stroke="#c9e4d2" stroke-opacity=".18" stroke-dasharray="2 8"/>
  <circle cx="300" cy="300" r="222" fill="url(#ocean)" stroke="#c9e4d2" stroke-opacity=".45"/>
  <g clip-path="url(#globeClip)">
    <path d="M70 345c57-62 102-69 155-54 30 9 54 30 74 60 17 25 23 53 47 69 24 17 49 8 72 25 16 12 25 40 54 57v98H70z" fill="#2f8e83" opacity=".32"/>
    <path d="M283 96 322 106l20 19 27 5 13 20 35 10 20 27-7 27 21 18-7 24-28 12-15 25-10 30-17 16-9 30-20 17-11 35-18 31-16-27-8-36-15-22-4-31-19-24-23-14-18-26 8-24-21-20 10-25 30-9 21-21 31 4 16-26z" fill="url(#land)" stroke="#fff" stroke-opacity=".65" stroke-width="1.4"/>
    <path d="M264 333c-26 13-44 26-62 48-16 19-24 39-37 58" fill="none" stroke="#d5e7ca" stroke-width="2" stroke-opacity=".45"/>
    <path d="M320 352c-12 36-8 61 12 86 15 19 35 31 54 46" fill="none" stroke="#d5e7ca" stroke-width="2" stroke-opacity=".4"/>
    <g class="ocean-ripples" fill="none" stroke="#78d0bd" stroke-opacity=".58" stroke-width="1.5"><path d="M95 401c35-15 71-15 106 0s71 15 106 0 71-15 106 0 71 15 106 0"/><path d="M82 417c35-15 71-15 106 0s71 15 106 0 71-15 106 0 71 15 106 0"/><path d="M106 433c35-15 71-15 106 0s71 15 106 0 71-15 106 0 71 15 106 0"/></g>
  </g>
  <g class="atmosphere" fill="none" stroke="url(#air)" stroke-width="12"><path d="M98 268c24-118 137-191 256-166 69 14 118 57 143 117"/><path d="M117 355c46 112 173 158 284 102 40-20 72-52 91-91"/></g>
  <g fill="none" stroke="#f1b579" stroke-width="2.5" stroke-dasharray="8 9" marker-end="url(#windArrow)">
    <path class="wind-flow flow-one" d="M91 412c48-75 108-96 169-76 49 16 74 4 99-29 29-37 54-76 113-92"/>
    <path class="wind-flow flow-two" d="M132 476c29-56 67-93 111-102 48-9 69 24 107 18 38-7 61-48 96-68"/>
  </g>
  <g class="heat-flux" fill="none" stroke="#d8ead1" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#fluxArrow)">
    <path d="M221 394c-9-30-6-51 11-73"/><path d="M354 423c5-30 0-48-17-67"/><path d="M420 385c-4-24-15-39-33-50"/>
  </g>
  <g class="flux-points" filter="url(#glow)"><circle cx="223" cy="394" r="4"/><circle cx="355" cy="424" r="4"/><circle cx="420" cy="385" r="4"/></g>
  <g class="orbit-particles"><circle r="4" fill="#f1b579"><animateMotion dur="9s" repeatCount="indefinite" path="M91 412c48-75 108-96 169-76 49 16 74 4 99-29 29-37 54-76 113-92"/></circle><circle r="3" fill="#c9e4d2"><animateMotion dur="12s" repeatCount="indefinite" path="M132 476c29-56 67-93 111-102 48-9 69 24 107 18 38-7 61-48 96-68"/></circle></g>
  <g class="graphic-labels" font-family="DM Sans,Arial,sans-serif" letter-spacing="2" font-size="10" font-weight="700" fill="#d8ead1">
    <text x="254" y="310">INDIA</text><text x="370" y="494">INDIAN OCEAN</text><text x="396" y="352" font-size="8">BAY OF BENGAL</text><text x="73" y="467" font-size="8">SOUTH-WEST MONSOON</text>
  </g>
  <g class="coupling-label" font-family="DM Sans,Arial,sans-serif" font-size="8" font-weight="600" letter-spacing="1.4" fill="#f1b579"><text x="232" y="470">OCEAN–ATMOSPHERE EXCHANGE</text></g>
</svg>
